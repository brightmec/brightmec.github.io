name: Remove original video from history
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install history filter and ffprobe
        run: |
          python -m pip install --user git-filter-repo
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Rewrite main without the original video
        run: |
          python -m git_filter_repo --force --path IMG-3541.mov --invert-paths
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test -z "$(git log --all --format=%H -- IMG-3541.mov)"
          echo "Filtered main: $(git rev-parse HEAD)"
          git push --force origin HEAD:refs/heads/main
      - name: Verify compressed video metadata
        run: |
          ffprobe -v error -show_entries format_tags:stream_tags -of json about-background.mp4
          ls -lh about-background.mp4 about-poster.jpg
