name: Prepare About video assets
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  encode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Encode mobile video and poster
        run: |
          ffmpeg -y -i IMG-3541.mov -t 20 -map 0:v:0 -vf "scale=480:-2,fps=24" -an -c:v libx264 -preset slow -crf 31 -pix_fmt yuv420p -movflags +faststart about-background.mp4
          ffmpeg -y -i IMG-3541.mov -frames:v 1 -vf "scale=480:-2" -q:v 6 about-poster.jpg
          ls -lh about-background.mp4 about-poster.jpg
      - name: Commit optimized assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add about-background.mp4 about-poster.jpg
          git commit -m 'Optimize About background assets'
          git push origin HEAD:main
