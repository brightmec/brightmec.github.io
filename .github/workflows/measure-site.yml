name: Measure live site
on: workflow_dispatch
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install playwright && npx playwright install --with-deps chromium
      - name: Measure candidate and live at 375px
        run: |
          python3 -m http.server 8000 >/tmp/site.log 2>&1 &
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true,args:['--no-sandbox']});
            for(const [name,url] of [['CANDIDATE','http://127.0.0.1:8000/'],['LIVE','https://brightmec.com/?verify=mobile-pass']]) {
              const p=await b.newPage({viewport:{width:375,height:812},deviceScaleFactor:1});
              await p.goto(url,{waitUntil:'networkidle'});
              console.log(name,'INITIAL',JSON.stringify(await p.evaluate(()=>({viewport:[innerWidth,innerHeight],cardText:document.querySelector('#services li:last-child').textContent,video:document.querySelector('#about video source').getAttribute('src'),mask:getComputedStyle(document.querySelector('#services')).maskImage,servicePadding:getComputedStyle(document.querySelector('#services')).paddingBottom,spacer:document.querySelector('#about').previousElementSibling.offsetHeight,headingOpacity:getComputedStyle(document.querySelector('#services .section-head')).opacity,aboutPadding:getComputedStyle(document.querySelector('#about')).paddingTop}))));
              for(let y=0;y<4500;y+=50) {
                const r=await p.evaluate(async y=>{document.documentElement.style.scrollBehavior='auto';scrollTo(0,y);await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const q=s=>document.querySelector(s),s=q('#services'),h=q('#services .section-head'),c=q('#services li:last-child'),a=q('#about'),head=q('header');const rect=e=>{const r=e.getBoundingClientRect();return [Math.round(r.top*100)/100,Math.round(r.bottom*100)/100]};let hr=h.getBoundingClientRect(),cr=c.getBoundingClientRect(),ar=a.getBoundingClientRect();let x=Math.min(innerWidth-2,Math.max(2,hr.left+10)),hy=Math.min(innerHeight-1,Math.max(0,(hr.top+hr.bottom)/2)),hit=document.elementFromPoint(x,hy);return {scroll:scrollY,header:rect(head),heading:rect(h),headOpacity:getComputedStyle(h).opacity,serviceOpacity:getComputedStyle(s).opacity,transform:getComputedStyle(s).transform,card:rect(c),about:rect(a),uncovered:!!hit&&h.contains(hit),gap:Math.round((ar.top-cr.bottom)*100)/100}},y);
                if((r.heading[1]>100&&r.heading[0]<812)||(r.card[1]>100&&r.card[0]<812)||(r.about[0]>100&&r.about[0]<812)) console.log(name,'SAMPLE',JSON.stringify(r));
              }
              await p.close();
            }
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
