name: Measure live site
on: workflow_dispatch
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install playwright && npx playwright install --with-deps chromium && pip install pillow
      - name: Measure 375px viewport
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true,args:['--no-sandbox']});
            const p=await b.newPage({viewport:{width:375,height:812},deviceScaleFactor:1});
            await p.goto('https://brightmec.com/',{waitUntil:'networkidle'});
            await p.screenshot({path:'/tmp/live.png'});
            console.log('RECTS',JSON.stringify(await p.evaluate(()=>Object.fromEntries(['header','header img','header .brand-phone','.hero','.hero .eyebrow','#about'].map(s=>{let e=document.querySelector(s),r=e.getBoundingClientRect();return [s,{x:r.x,y:r.y,width:r.width,height:r.height}]})))));
            console.log('PHONES',JSON.stringify(await p.locator('header .brand-phone').evaluateAll(es=>es.map(e=>{let r=e.getBoundingClientRect();return {text:e.textContent,y:r.y,height:r.height}}))));
            const photo='https://brightmec.com/4a62a846-54c8-4f30-adc3-74c794758d0d.jpeg'; const r=await p.request.get(photo); console.log('PHOTO_HTTP',r.status(),r.headers()['content-type']); console.log('HOME',JSON.stringify(await p.evaluate(async()=>{const q=s=>document.querySelector(s),read=e=>{let s=getComputedStyle(e),r=e.getBoundingClientRect();return {text:e.textContent,href:e.getAttribute('href'),rect:[r.x,r.y,r.width,r.height],font:s.fontFamily,fontSize:s.fontSize,weight:s.fontWeight,color:s.color,background:s.backgroundColor,image:s.backgroundImage,size:s.backgroundSize,position:s.backgroundPosition,opacity:s.opacity,padding:s.padding,radius:s.borderRadius}};let im=new Image();im.src='/4a62a846-54c8-4f30-adc3-74c794758d0d.jpeg';await im.decode().catch(()=>{});return {viewport:[innerWidth,innerHeight],imageSize:[im.naturalWidth,im.naturalHeight],header:read(q('header')),hero:read(q('.hero')),heading:read(q('.hero h1')),intro:read(q('.intro')),call:read(q('.hero-copy a[href^="tel:"]')),check:read(q('.hero-copy a[href="/check.html"]')),mask:getComputedStyle(q('.hero')).maskImage}}))); for(const y of [0,200,500,800,1100,1300,1500,1700,1900,2200,2600,3000,3400,3800]) {console.log('SCROLL',JSON.stringify(await p.evaluate(async y=>{document.documentElement.style.scrollBehavior='auto';scrollTo(0,y);await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));let rect=e=>{let r=e.getBoundingClientRect(),s=getComputedStyle(e);return {top:r.top,bottom:r.bottom,opacity:s.opacity,transform:s.transform}};let hit=[200,400,600,780].map(y=>{let e=document.elementFromPoint(187,y);return e&&e.closest('section')?.className||e?.tagName});return {scroll:scrollY,hero:rect(document.querySelector('.hero')),services:rect(document.querySelector('#services')),about:rect(document.querySelector('#about')),hit}},y)));} await p.goto('https://brightmec.com/check.html',{waitUntil:'networkidle'});console.log('CHECK_FONT',await p.locator('body').evaluate(e=>getComputedStyle(e).fontFamily));await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          python - <<'PY'
          from PIL import Image
          im=Image.open('/tmp/live.png').convert('RGB')
          active=[]
          for y in range(0,300):
            n=sum(1 for x in range(30,345) if max(im.getpixel((x,y)))-min(im.getpixel((x,y)))<40 and max(im.getpixel((x,y)))>65)
            if n>=3: active.append(y)
          groups=[]
          for y in active:
            if not groups or y>groups[-1][-1]+1: groups.append([y])
            else: groups[-1].append(y)
          print('VISIBLE_ROW_GROUPS', [(g[0],g[-1]) for g in groups])
          PY
